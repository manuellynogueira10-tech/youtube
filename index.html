<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="referrer"
  content="strict-origin-when-cross-origin"
>

<title>YouTube 2</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #272727;
  --surface3: #333333;

  --text: #ffffff;
  --muted: #aaaaaa;

  --accent: #ff0033;
  --border: #303030;

  --header-height: 64px;
  --sidebar-width: 230px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
  height: var(--header-height);

  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  z-index: 1000;

  background: rgba(15,15,15,.97);

  display: flex;
  align-items: center;

  gap: 16px;

  padding: 0 18px;

  border-bottom: 1px solid #1f1f1f;
}

.menu-btn {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  border: none;

  background: transparent;
  color: white;

  font-size: 24px;

  cursor: pointer;
}

.menu-btn:hover {
  background: #272727;
}

.logo {
  display: flex;
  align-items: center;

  gap: 8px;

  font-weight: 800;
  font-size: 21px;

  white-space: nowrap;

  cursor: pointer;
}

.logo-icon {
  width: 34px;
  height: 24px;

  border-radius: 7px;

  background: var(--accent);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 13px;
}

.search {
  flex: 1;

  max-width: 680px;

  display: flex;

  margin: auto;
}

.search input {
  flex: 1;

  height: 42px;

  background: #121212;

  border:
    1px solid
    #303030;

  border-radius:
    22px 0 0 22px;

  padding:
    0 17px;

  color: white;

  font-size: 16px;

  outline: none;
}

.search input:focus {
  border-color: #1c62b9;
}

.search button {
  width: 62px;

  border: none;

  border-left: 1px solid #303030;

  border-radius:
    0 22px 22px 0;

  background: #222;

  color: white;

  font-size: 18px;

  cursor: pointer;
}

.header-actions {
  display: flex;
  align-items: center;

  gap: 8px;
}

.icon-btn {
  width: 42px;
  height: 42px;

  border: none;

  border-radius: 50%;

  background: transparent;
  color: white;

  cursor: pointer;

  font-size: 20px;
}

.icon-btn:hover {
  background: #272727;
}

.avatar {
  width: 36px;
  height: 36px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #6f42ff,
      #ff2d7a
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;

  cursor: pointer;

  flex-shrink: 0;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  position: fixed;

  left: 0;
  top: var(--header-height);
  bottom: 0;

  width: var(--sidebar-width);

  background: var(--bg);

  padding: 12px;

  overflow-y: auto;

  z-index: 900;

  transition: .25s;
}

.sidebar.collapsed {
  transform:
    translateX(
      calc(
        -1 * var(--sidebar-width)
      )
    );
}

.side-item {
  height: 46px;

  border-radius: 11px;

  display: flex;
  align-items: center;

  gap: 18px;

  padding:
    0 14px;

  cursor: pointer;

  font-size: 14px;
}

.side-item:hover,
.side-item.active {
  background: #272727;
}

.side-icon {
  width: 24px;

  font-size: 21px;

  text-align: center;
}

.sidebar hr {
  border: none;

  border-top:
    1px solid #303030;

  margin: 12px 0;
}

/* =========================
   MAIN
========================= */

main {
  margin-top:
    var(--header-height);

  margin-left:
    var(--sidebar-width);

  padding:
    18px 24px 60px;

  transition: .25s;
}

main.full {
  margin-left: 0;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

/* =========================
   CATEGORIES
========================= */

.categories {
  display: flex;

  gap: 10px;

  overflow-x: auto;

  padding-bottom: 18px;

  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  padding:
    8px 14px;

  border: none;

  border-radius: 9px;

  background: #272727;

  color: white;

  font-weight: 600;

  white-space: nowrap;

  cursor: pointer;
}

.category.active {
  background: white;
  color: #111;
}

/* =========================
   VIDEOS
========================= */

.section-title {
  font-size: 22px;

  margin:
    6px 0 18px;
}

.video-grid {
  display: grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:
    28px 18px;
}

.video-card {
  cursor: pointer;
}

.thumbnail {
  position: relative;

  width: 100%;

  aspect-ratio:
    16 / 9;

  overflow: hidden;

  border-radius: 12px;

  background: #222;
}

.thumbnail img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transition: .2s;
}

.video-card:hover
.thumbnail img {
  transform:
    scale(1.025);
}

.duration {
  position: absolute;

  right: 7px;
  bottom: 7px;

  background:
    rgba(0,0,0,.82);

  color: white;

  padding:
    3px 6px;

  border-radius: 5px;

  font-size: 12px;
}

.video-info {
  display: flex;

  gap: 11px;

  margin-top: 12px;
}

.channel-avatar {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  flex-shrink: 0;

  background:
    linear-gradient(
      135deg,
      #155fff,
      #00c2ff
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
}

.video-title {
  font-size: 15px;

  font-weight: 650;

  line-height: 1.35;

  margin-bottom: 6px;

  display: -webkit-box;

  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
}

.video-meta {
  color: var(--muted);

  font-size: 13px;

  line-height: 1.45;
}

/* =========================
   PLAYER
========================= */

.watch-layout {
  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    360px;

  gap: 24px;
}

.player {
  width: 100%;

  aspect-ratio:
    16 / 9;

  background: #000;

  border-radius: 14px;

  overflow: hidden;
}

.player iframe {
  width: 100%;
  height: 100%;

  border: none;
}

.watch-title {
  font-size: 21px;

  margin:
    15px 0 12px;
}

.watch-actions {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 16px;

  flex-wrap: wrap;
}

.channel-row {
  display: flex;

  gap: 12px;

  align-items: center;
}

.channel-big-avatar {
  width: 44px;
  height: 44px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #365cff,
      #00c6ff
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
}

.channel-name {
  font-weight: 700;

  margin-bottom: 3px;
}

.subscriber-count {
  color: #aaa;

  font-size: 12px;
}

.subscribe {
  padding:
    10px 16px;

  border: none;

  border-radius: 22px;

  background: white;

  color: black;

  font-weight: bold;

  cursor: pointer;
}

.action-buttons {
  display: flex;

  gap: 8px;

  flex-wrap: wrap;
}

.action-btn {
  border: none;

  border-radius: 22px;

  padding:
    10px 14px;

  background: #272727;

  color: white;

  cursor: pointer;

  font-weight: 600;
}

.action-btn.active {
  background: white;

  color: black;
}

.description-box {
  margin-top: 16px;

  padding: 14px;

  border-radius: 12px;

  background: #272727;

  font-size: 14px;

  line-height: 1.55;
}

.related-list {
  display: flex;

  flex-direction: column;

  gap: 12px;
}

.related-card {
  display: grid;

  grid-template-columns:
    168px 1fr;

  gap: 10px;

  cursor: pointer;
}

.related-thumb {
  width: 168px;

  aspect-ratio:
    16 / 9;

  object-fit: cover;

  border-radius: 9px;
}

/* =========================
   SHORTS
========================= */

.shorts-grid {
  display: grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap: 18px;
}

.short-card {
  cursor: pointer;
}

.short-thumb {
  width: 100%;

  aspect-ratio:
    9 / 16;

  border-radius: 14px;

  object-fit: cover;

  background: #222;
}

.short-title {
  margin-top: 9px;

  font-size: 14px;

  font-weight: 650;

  line-height: 1.35;
}

.short-views {
  color: #aaa;

  font-size: 13px;

  margin-top: 4px;
}

/* =========================
   POSTS
========================= */

.posts {
  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap: 18px;
}

.post {
  background: #181818;

  border:
    1px solid #2b2b2b;

  border-radius: 16px;

  padding: 18px;
}

.post-head {
  display: flex;

  gap: 11px;

  align-items: center;

  margin-bottom: 14px;
}

.post-text {
  line-height: 1.55;

  margin-bottom: 16px;
}

.post-actions {
  color: #aaa;

  display: flex;

  gap: 22px;

  font-size: 14px;
}

/* =========================
   PROFILE
========================= */

.profile-box {
  background:
    linear-gradient(
      135deg,
      #202020,
      #101010
    );

  border:
    1px solid #303030;

  border-radius: 18px;

  padding: 24px;

  display: flex;

  align-items: center;

  gap: 18px;

  margin-bottom: 26px;
}

.profile-avatar {
  width: 82px;
  height: 82px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #794dff,
      #ff375f
    );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 30px;

  font-weight: bold;
}

.profile-name {
  font-size: 24px;

  font-weight: bold;
}

.profile-sub {
  color: #aaa;

  margin-top: 5px;
}

/* =========================
   EMPTY
========================= */

.empty {
  padding: 45px 20px;

  text-align: center;

  color: #aaa;
}

/* =========================
   MOBILE
========================= */

@media
(max-width: 1250px) {

  .video-grid {
    grid-template-columns:
      repeat(
        3,
        minmax(0,1fr)
      );
  }

  .shorts-grid {
    grid-template-columns:
      repeat(
        4,
        minmax(0,1fr)
      );
  }

}

@media
(max-width: 950px) {

  .sidebar {
    transform:
      translateX(
        calc(
          -1 *
          var(--sidebar-width)
        )
      );
  }

  .sidebar.mobile-open {
    transform:
      translateX(0);
  }

  main {
    margin-left: 0;

    padding:
      16px 14px 55px;
  }

  .video-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .watch-layout {
    grid-template-columns:
      1fr;
  }

  .shorts-grid {
    grid-template-columns:
      repeat(
        3,
        minmax(0,1fr)
      );
  }

  .posts {
    grid-template-columns:
      1fr;
  }

}

@media
(max-width: 650px) {

  header {
    gap: 7px;

    padding:
      0 9px;
  }

  .logo span {
    display: none;
  }

  .search {
    margin: 0;
  }

  .search input {
    min-width: 0;

    font-size: 14px;
  }

  .header-actions
  .icon-btn {
    display: none;
  }

  main {
    padding:
      12px 9px 50px;
  }

  .video-grid {
    grid-template-columns:
      1fr;

    gap: 25px;
  }

  .thumbnail {
    border-radius: 10px;
  }

  .shorts-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .related-card {
    grid-template-columns:
      145px 1fr;
  }

  .related-thumb {
    width: 145px;
  }

  .profile-box {
    flex-direction: column;

    text-align: center;
  }

}

</style>
</head>

   BANCO LOCAL DE VÍDEOS

const videos = [
