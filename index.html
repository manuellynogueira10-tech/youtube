<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      img-src 'self' https://i.ytimg.com https://img.youtube.com data:;
      frame-src https://www.youtube-nocookie.com;
      connect-src 'self';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
      style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline';
      upgrade-insecure-requests;
    "
  >

  <meta name="theme-color" content="#0f0f0f">

  <title>YouTube 2</title>

  <style>
    :root {
      color-scheme: dark;

      --background: #0f0f0f;
      --surface: #181818;
      --surface2: #222;
      --border: #303030;

      --text: #f1f1f1;
      --muted: #aaa;

      --accent: #ff0033;

      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--background);
      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      position: sticky;
      top: 0;

      z-index: 50;

      height: var(--header-height);

      display: flex;
      align-items: center;

      gap: 16px;

      padding: 10px 18px;

      background: rgba(15,15,15,.96);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(16px);
    }

    .logo {
      display: flex;
      align-items: center;

      gap: 9px;

      min-width: 160px;

      font-size: 20px;
      font-weight: 900;
    }

    .logo-icon {
      width: 36px;
      height: 26px;

      border-radius: 8px;

      display: grid;
      place-items: center;

      background: var(--accent);

      font-size: 14px;
    }

    .search {
      flex: 1;

      display: flex;

      max-width: 720px;

      margin: auto;
    }

    .search input {
      width: 100%;

      height: 42px;

      padding: 0 15px;

      border:

        1px solid var(--border);

      border-right: 0;

      border-radius: 22px 0 0 22px;

      outline: none;

      background: #121212;

      color: var(--text);
    }

    .search input:focus {
      border-color: #5b71ff;
    }

    .search button {
      width: 60px;

      border:

        1px solid var(--border);

      border-radius: 0 22px 22px 0;

      background: #222;

      color: var(--text);
    }

    main {
      max-width: 1600px;

      margin: auto;

      padding: 24px;
    }

    .hero {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 22px;
    }

    h1 {
      margin: 0;

      font-size: clamp(25px, 4vw, 36px);
    }

    .subtitle {
      margin-top: 6px;

      color: var(--muted);
    }

    .status {
      color: var(--muted);

      font-size: 13px;

      padding: 8px 12px;

      border: 1px solid var(--border);

      border-radius: 999px;

      background: var(--surface);
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0,1fr));

      gap: 28px 16px;
    }

    .card {
      cursor: pointer;

      min-width: 0;
    }

    .thumbnail {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      overflow: hidden;

      border-radius: 12px;

      background: var(--surface2);
    }

    .thumbnail img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: transform .2s ease;
    }

    .card:hover img {
      transform: scale(1.025);
    }

    .short-label {
      position: absolute;

      right: 8px;
      bottom: 8px;

      padding: 4px 7px;

      border-radius: 6px;

      background: rgba(0,0,0,.82);

      font-size: 11px;
      font-weight: 800;
    }

    .video-title {
      margin-top: 10px;

      font-size: 15px;
      font-weight: 750;

      line-height: 1.35;

      display: -webkit-box;

      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .channel {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
    }

    .message {
      grid-column: 1 / -1;

      padding: 50px 20px;

      text-align: center;

      color: var(--muted);

      border: 1px solid var(--border);

      border-radius: 14px;

      background: var(--surface);
    }

    .watch {
      display: none;
    }

    .watch.active {
      display: block;
    }

    .home.hidden {
      display: none;
    }

    .player {
      width: 100%;

      max-width: 1200px;

      margin: auto;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 16px;

      overflow: hidden;
    }

    .player iframe {
      width: 100%;
      height: 100%;

      display: block;

      border: 0;
    }

    .watch-info {
      max-width: 1200px;

      margin: 18px auto;
    }

    .watch-info h2 {
      margin: 0 0 8px;
    }

    .watch-channel {
      color: var(--muted);
    }

    .back {
      margin-top: 18px;

      padding: 10px 15px;

      border: 1px solid var(--border);

      border-radius: 999px;

      background: var(--surface2);

      color: var(--text);
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns:
          repeat(3,1fr);
      }
    }

    @media (max-width: 850px) {
      .logo span {
        display: none;
      }

      .logo {
        min-width: auto;
      }

      .grid {
        grid-template-columns:
          repeat(2,1fr);
      }

      main {
        padding: 18px 12px;
      }
    }

    @media (max-width: 560px) {
      header {
        gap: 8px;

        padding: 9px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        align-items: flex-start;

        flex-direction: column;
      }

      .status {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">

    <div class="logo-icon">
      ▶
    </div>

    <span>
      YouTube 2
    </span>

  </div>

  <div class="search">

    <input
      id="searchInput"
      type="search"
      maxlength="80"
      autocomplete="off"
      spellcheck="false"
      placeholder="Pesquisar vídeos"
    >

    <button
      id="searchButton"
      type="button"
      aria-label="Pesquisar"
    >
      🔍
    </button>

  </div>

</header>


<main>

  <section
    id="home"
    class="home"
  >

    <div class="hero">

      <div>

        <h1 id="pageTitle">
          Para você
        </h1>

        <div
          id="subtitle"
          class="subtitle"
        >
          Vídeos encontrados automaticamente.
        </div>

      </div>

      <div
        id="status"
        class="status"
      >
        Carregando...
      </div>

    </div>

    <div
      id="grid"
      class="grid"
    ></div>

  </section>


  <section
    id="watch"
    class="watch"
  >

    <div class="player">

      <iframe
        id="player"
        title="Player de vídeo"
        allow="
          autoplay;
          encrypted-media;
          picture-in-picture;
          fullscreen
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>

    </div>

    <div class="watch-info">

      <h2 id="watchTitle"></h2>

      <div
        id="watchChannel"
        class="watch-channel"
      ></div>

      <button
        id="backButton"
        class="back"
        type="button"
      >
        ← Voltar
      </button>

    </div>

  </section>

</main>


<script>
"use strict";


const CONFIG = Object.freeze({

  MAX_VIDEOS: 40,

  SEARCH_MAX_LENGTH: 80,

  VIDEO_ID_PATTERN:
    /^[A-Za-z0-9_-]{11}$/,

});


const state = {

  videos: [],

};


const elements = {

  home:
    document.getElementById("home"),

  watch:
    document.getElementById("watch"),

  grid:
    document.getElementById("grid"),

  status:
    document.getElementById("status"),

  pageTitle:
    document.getElementById("pageTitle"),

  subtitle:
    document.getElementById("subtitle"),

  searchInput:
    document.getElementById("searchInput"),

  searchButton:
    document.getElementById("searchButton"),

  player:
    document.getElementById("player"),

  watchTitle:
    document.getElementById("watchTitle"),

  watchChannel:
    document.getElementById("watchChannel"),

  backButton:
    document.getElementById("backButton"),

};


function cleanText(
  value,
  maxLength
) {

  return String(
    value ?? ""
  )
    .replace(/\s+/g, " ")
    .trim()
    .slice(
      0,
      maxLength
    );

}


function sanitizeVideo(
  raw
) {

  if (
    !raw ||
    typeof raw !== "object"
  ) {

    return null;

  }


  const id =
    cleanText(
      raw.id,
      20
    );


  if (
    !CONFIG
      .VIDEO_ID_PATTERN
      .test(id)
  ) {

    return null;

  }


  const title =
    cleanText(
      raw.title,
      180
    ) || "Vídeo";


  const channel =
    cleanText(
      raw.channel,
      100
    ) || "YouTube";


  return {

    id,

    title,

    channel,

    short:
      raw.short === true,

  };

}


function thumbnailURL(
  videoId
) {

  return (
    "https://i.ytimg.com/vi/" +
    videoId +
    "/hqdefault.jpg"
  );

}


function createMessage(
  text
) {

  const box =
    document.createElement("div");

  box.className =
    "message";

  box.textContent =
    text;

  return box;

}


function openVideo(
  video
) {

  if (
    !video ||
    !CONFIG
      .VIDEO_ID_PATTERN
      .test(video.id)
  ) {

    return;

  }


  elements.home
    .classList
    .add("hidden");


  elements.watch
    .classList
    .add("active");


  elements.watchTitle
    .textContent =
      video.title;


  elements.watchChannel
    .textContent =
      video.channel;


  elements.player.src =
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(video.id) +
    "?autoplay=1&playsinline=1&rel=0";


  window.scrollTo({
    top: 0,
    behavior: "smooth",
  });

}


function closeVideo() {

  elements.player.src =
    "";


  elements.watch
    .classList
    .remove("active");


  elements.home
    .classList
    .remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth",
  });

}


function createCard(
  video
) {

  const card =
    document.createElement("article");


  card.className =
    "card";


  card.tabIndex =
    0;


  card.setAttribute(
    "role",
    "button"
  );


  const thumbnail =
    document.createElement("div");


  thumbnail.className =
    "thumbnail";


  const image =
    document.createElement("img");


  image.loading =
    "lazy";


  image.decoding =
    "async";


  image.alt =
    video.title;


  image.src =
    thumbnailURL(
      video.id
    );


  thumbnail.append(
    image
  );


  if (
    video.short
  ) {

    const label =
      document.createElement("span");


    label.className =
      "short-label";


    label.textContent =
      "SHORT";


    thumbnail.append(
      label
    );

  }


  const title =
    document.createElement("div");


  title.className =
    "video-title";


  title.textContent =
    video.title;


  const channel =
    document.createElement("div");


  channel.className =
    "channel";


  channel.textContent =
    video.channel;


  card.append(
    thumbnail,
    title,
    channel
  );


  const open =
    () =>
      openVideo(video);


  card.addEventListener(
    "click",
    open
  );


  card.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {

        event.preventDefault();

        open();

      }

    }
  );


  return card;

}


function renderVideos(
  videos
) {

  elements.grid
    .replaceChildren();


  if (
    !videos.length
  ) {

    elements.grid
      .append(
        createMessage(
          "Nenhum vídeo encontrado."
        )
      );

    return;

  }


  for (
    const video
    of videos
  ) {

    elements.grid
      .append(
        createCard(video)
      );

  }

}


async function requestJSON(
  url
) {

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () =>
        controller.abort(),
      20000
    );


  try {

    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            Accept:
              "application/json",
          },

          cache:
            "no-store",

          signal:
            controller.signal,
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const text =
      await response.text();


    if (
      text.length >
      2_000_000
    ) {

      throw new Error(
        "Resposta muito grande."
      );

    }


    return JSON.parse(
      text
    );

  }

  finally {

    clearTimeout(
      timer
    );

  }

}


function normalizeVideos(
  data
) {

  const source =
    Array.isArray(data)
      ? data
      : data?.videos;


  if (
    !Array.isArray(source)
  ) {

    return [];

  }


  const unique =
    new Map();


  for (
    const raw
    of source
  ) {

    const video =
      sanitizeVideo(raw);


    if (
      !video
    ) {

      continue;

    }


    if (
      !unique.has(
        video.id
      )
    ) {

      unique.set(
        video.id,
        video
      );

    }


    if (
      unique.size >=
      CONFIG.MAX_VIDEOS
    ) {

      break;

    }

  }


  return [
    ...unique.values()
  ];

}


async function loadFeed() {

  elements.status
    .textContent =
      "Carregando...";


  try {

    const data =
      await requestJSON(
        "/api/videos"
      );


    const videos =
      normalizeVideos(
        data
      );


    state.videos =
      videos;


    renderVideos(
      videos
    );


    elements.status
      .textContent =
        videos.length +
        " vídeos";

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    elements.status
      .textContent =
        "Indisponível";


    elements.grid
      .replaceChildren(
        createMessage(
          "Não foi possível carregar os vídeos."
        )
      );

  }

}


async function searchVideos() {

  const query =
    cleanText(
      elements
        .searchInput
        .value,
      CONFIG
        .SEARCH_MAX_LENGTH
    );


  if (
    !query
  ) {

    elements.pageTitle
      .textContent =
        "Para você";


    elements.subtitle
      .textContent =
        "Vídeos encontrados automaticamente.";


    await loadFeed();

    return;

  }


  elements.pageTitle
    .textContent =
      "Resultados";


  elements.subtitle
    .textContent =
      "Resultados para “" +
      query +
      "”.";


  elements.status
    .textContent =
      "Pesquisando...";


  elements.grid
    .replaceChildren(
      createMessage(
        "Pesquisando vídeos..."
      )
    );


  try {

    const data =
      await requestJSON(
        "/api/search?q=" +
        encodeURIComponent(
          query
        )
      );


    const videos =
      normalizeVideos(
        data
      );


    state.videos =
      videos;


    renderVideos(
      videos
    );


    elements.status
      .textContent =
        videos.length +
        " resultados";

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    elements.status
      .textContent =
        "Erro";


    elements.grid
      .replaceChildren(
        createMessage(
          "A pesquisa não pôde ser concluída."
        )
      );

  }

}


elements.searchButton
  .addEventListener(
    "click",
    searchVideos
  );


elements.searchInput
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        searchVideos();

      }

    }
  );


elements.backButton
  .addEventListener(
    "click",
    closeVideo
  );


loadFeed();
</script>

</body>
</html>
