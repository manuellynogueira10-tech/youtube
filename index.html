<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' https://i.ytimg.com https://img.youtube.com data:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; upgrade-insecure-requests;">
  <meta name="theme-color" content="#0b0d12">
  <title>YouTube 2</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--surface:#131721;--surface2:#1b2130;--line:#262e3e;--text:#f7f8fb;--muted:#9ba6b7;--accent:#ff3d6e;--accent2:#7c5cff;--header:68px;--rail:232px;--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
    .topbar{position:fixed;top:0;left:0;right:0;height:var(--header);z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(11,13,18,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:10px;min-width:200px;font-weight:900;font-size:20px}.brandMark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2))}
    .searchBox{flex:1;max-width:760px;margin:auto;display:flex}.searchBox input{width:100%;height:44px;padding:0 15px;border:1px solid var(--line);border-right:0;border-radius:14px 0 0 14px;outline:0;background:#0f131c;color:var(--text)}.searchBox input:focus{border-color:#59657a}.searchBox button{width:54px;border:1px solid var(--line);border-radius:0 14px 14px 0;background:var(--surface2);color:var(--text)}
    .profile{width:40px;height:40px;border:0;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#8d5cff);color:#fff;font-weight:900}
    .rail{position:fixed;left:0;top:var(--header);bottom:0;width:var(--rail);z-index:40;padding:16px 12px;border-right:1px solid var(--line);background:var(--bg)}
    .navBtn{width:100%;display:flex;align-items:center;gap:13px;margin-bottom:6px;padding:12px 13px;border:0;border-radius:13px;text-align:left;background:transparent;color:var(--muted);font-weight:750}.navBtn:hover,.navBtn.active{background:var(--surface2);color:var(--text)}.navIcon{width:24px;text-align:center;font-size:19px}
    .main{max-width:1680px;margin-left:var(--rail);padding:calc(var(--header) + 20px) 24px 90px}.view{display:none}.view.active{display:block}
    .hero{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:4px 0 20px}.hero h1{margin:0;font-size:clamp(26px,4vw,38px)}.hero p{margin:7px 0 0;color:var(--muted)}.badge{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px}
    .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);white-space:nowrap;font-weight:700}.chip.active{background:var(--text);color:#0c0f14}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 17px}.card{min-width:0;cursor:pointer;outline:none}.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:var(--radius);background:var(--surface2)}.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .22s}.card:hover .thumb img{transform:scale(1.025)}.shortPill{position:absolute;right:9px;bottom:9px;padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.78);font-size:11px;font-weight:850}
    .cardBody{display:flex;gap:10px;padding-top:11px}.channelDot{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#2e7cff,#24d3b5);font-weight:900}.cardTitle{font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cardMeta{margin-top:5px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .watchLayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px}.playerWrap{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:22px;background:#000}.playerWrap.shortMode{max-width:430px;margin:auto;aspect-ratio:9/16}.playerWrap iframe{display:block;width:100%;height:100%;border:0}.watchTitle{margin:16px 0 10px;font-size:clamp(20px,3vw,27px)}.channelRow{display:flex;align-items:center;gap:10px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.action{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--text);font-weight:750}.action.on{background:var(--text);color:#10131a}.description{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--muted);line-height:1.55}
    .sideCard{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:12px;cursor:pointer}.sideCard img{width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:11px}.sideCardTitle{font-size:13px;font-weight:800;line-height:1.35}.sideCardMeta{margin-top:5px;color:var(--muted);font-size:12px}
    .errorBox,.emptyBox{grid-column:1/-1;padding:36px 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--muted);text-align:center}.bottomNav{display:none}
    @media(max-width:1250px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:980px){:root{--rail:0px}.rail{display:none}.main{margin-left:0;padding-left:16px;padding-right:16px}.grid{grid-template-columns:repeat(2,1fr)}.watchLayout{grid-template-columns:1fr}.bottomNav{position:fixed;z-index:60;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border:1px solid var(--line);border-radius:24px;background:rgba(19,23,33,.96);backdrop-filter:blur(16px)}.bottomNav button{padding:9px 4px;border:0;border-radius:18px;background:transparent;color:var(--muted);font-weight:750}.bottomNav button.active{background:var(--surface2);color:var(--text)}}
    @media(max-width:620px){.topbar{gap:8px;padding:10px}.brand{min-width:auto}.brandText,.profile{display:none}.main{padding-left:10px;padding-right:10px}.grid{grid-template-columns:1fr;gap:24px}.hero{flex-direction:column;align-items:flex-start}.badge{display:none}.sideCard{grid-template-columns:140px 1fr}.sideCard img{width:140px}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brandMark">▶</div><span class="brandText">YouTube 2</span></div>
  <div class="searchBox"><input id="searchInput" type="search" maxlength="80" placeholder="Buscar vídeos e canais" autocomplete="off"><button id="searchButton" type="button" aria-label="Buscar">🔍</button></div>
  <button class="profile" type="button" aria-label="Perfil">M</button>
</header>
<aside class="rail">
  <button class="navBtn active" data-view="home"><span class="navIcon">⌂</span>Para você</button>
  <button class="navBtn" data-view="shorts"><span class="navIcon">⚡</span>Shorts</button>
  <button class="navBtn" data-view="history"><span class="navIcon">◷</span>Histórico</button>
  <button class="navBtn" data-view="saved"><span class="navIcon">♡</span>Salvos</button>
</aside>
<main class="main">
  <section id="view-home" class="view active">
    <div class="hero"><div><h1 id="homeTitle">Para você</h1><p id="homeSubtitle">O feed aprende com o que você assiste neste navegador.</p></div><div id="feedBadge" class="badge">Carregando feed…</div></div>
    <div id="chips" class="chips"></div>
    <div id="videoGrid" class="grid"></div>
  </section>
  <section id="view-watch" class="view">
    <div class="watchLayout">
      <div>
        <div id="playerWrap" class="playerWrap"><iframe id="player" title="Player do YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
        <h1 id="watchTitle" class="watchTitle"></h1>
        <div class="channelRow"><div id="watchAvatar" class="channelDot">Y</div><strong id="watchChannel"></strong></div>
        <div class="actions"><button id="likeButton" class="action">♡ Curtir</button><button id="laterButton" class="action">＋ Assistir depois</button><button id="shareButton" class="action">↗ Compartilhar</button><button id="backButton" class="action">← Voltar</button></div>
        <div class="description">Este vídeo é reproduzido pelo player oficial do YouTube. O site não armazena o arquivo do vídeo.</div>
      </div>
      <aside><h3>Mais para você</h3><div id="relatedList"></div></aside>
    </div>
  </section>
</main>
<nav class="bottomNav">
  <button class="active" data-view="home">⌂<br>Início</button>
  <button data-view="shorts">⚡<br>Shorts</button>
  <button data-view="history">◷<br>Histórico</button>
  <button data-view="saved">♡<br>Salvos</button>
</nav>
<script>
"use strict";

const CONFIG={DATA_URL:"./video_list.json",MAX_VIDEOS:40,PREFIX:"yt2_v3_",ID_PATTERN:/^[A-Za-z0-9_-]{11}$/};
let videos=[];let currentVideo=null;let currentView="home";let currentCategory="Todos";let searchTerm="";
const $=id=>document.getElementById(id);

function storageKey(name){return CONFIG.PREFIX+name}
function readArray(name){try{const value=JSON.parse(localStorage.getItem(storageKey(name))||"[]");return Array.isArray(value)?value.filter(x=>typeof x==="string"&&CONFIG.ID_PATTERN.test(x)).slice(0,100):[]}catch{return[]}}
function readObject(name){try{const value=JSON.parse(localStorage.getItem(storageKey(name))||"{}");return value&&typeof value==="object"&&!Array.isArray(value)?value:{}}catch{return{}}}
function saveStorage(name,value){try{localStorage.setItem(storageKey(name),JSON.stringify(value))}catch{}}
function safeVideo(raw){if(!raw||typeof raw!=="object")return null;const id=String(raw.id||"").trim();if(!CONFIG.ID_PATTERN.test(id))return null;const title=String(raw.title||"Vídeo").replace(/\s+/g," ").trim().slice(0,180)||"Vídeo";const channel=String(raw.channel||"YouTube").replace(/\s+/g," ").trim().slice(0,100)||"YouTube";return{id,title,channel,category:raw.short===true?"Shorts":"Vídeos",short:raw.short===true}}
function thumbnail(id){return "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"}
function byId(id){return videos.find(v=>v.id===id)||null}
function uniqueExisting(ids){const seen=new Set();const result=[];for(const id of ids){const v=byId(id);if(v&&!seen.has(id)){seen.add(id);result.push(v)}}return result}

async function loadVideos(){
  try{
    const response=await fetch(CONFIG.DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const documentData=await response.json();
    const rawVideos=Array.isArray(documentData)?documentData:documentData.videos;
    if(!Array.isArray(rawVideos))throw new Error("Formato JSON inválido.");
    const unique=new Map();
    for(const raw of rawVideos){const video=safeVideo(raw);if(video&&!unique.has(video.id))unique.set(video.id,video);if(unique.size>=CONFIG.MAX_VIDEOS)break}
    videos=[...unique.values()];
    if(!videos.length)throw new Error("Nenhum vídeo válido.");
    $("feedBadge").textContent=videos.length+" vídeos";
    createCategories();
    renderCurrentView();
  }catch(error){console.error(error);$("feedBadge").textContent="Feed indisponível";const box=document.createElement("div");box.className="errorBox";box.textContent="Não foi possível carregar video_list.json.";$("videoGrid").replaceChildren(box)}
}

function createCard(video){
  const card=document.createElement("article");card.className="card";card.tabIndex=0;card.setAttribute("role","button");
  const thumb=document.createElement("div");thumb.className="thumb";
  const image=document.createElement("img");image.loading="lazy";image.alt="";image.src=thumbnail(video.id);thumb.append(image);
  if(video.short){const badge=document.createElement("span");badge.className="shortPill";badge.textContent="SHORT";thumb.append(badge)}
  const body=document.createElement("div");body.className="cardBody";
  const avatar=document.createElement("div");avatar.className="channelDot";avatar.textContent=(video.channel[0]||"Y").toUpperCase();
  const text=document.createElement("div");const title=document.createElement("div");title.className="cardTitle";title.textContent=video.title;const meta=document.createElement("div");meta.className="cardMeta";meta.textContent=video.channel; text.append(title,meta);body.append(avatar,text);card.append(thumb,body);
  const open=()=>openVideo(video);card.addEventListener("click",open);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});return card
}

function createSideCard(video){const card=document.createElement("div");card.className="sideCard";card.tabIndex=0;const image=document.createElement("img");image.loading="lazy";image.alt="";image.src=thumbnail(video.id);const text=document.createElement("div");const title=document.createElement("div");title.className="sideCardTitle";title.textContent=video.title;const meta=document.createElement("div");meta.className="sideCardMeta";meta.textContent=video.channel;text.append(title,meta);card.append(image,text);const open=()=>openVideo(video);card.addEventListener("click",open);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});return card}

function createCategories(){const chips=$("chips");chips.replaceChildren();for(const name of ["Todos","Vídeos","Shorts"]){const button=document.createElement("button");button.className="chip"+(name===currentCategory?" active":"");button.textContent=name;button.addEventListener("click",()=>{currentCategory=name;createCategories();renderHome()});chips.append(button)}}
function recommendationScore(video){const counts=readObject("counts");const history=readArray("history");let score=Number(counts[video.id]||0)*10;const pos=history.indexOf(video.id);if(pos>=0)score+=Math.max(0,20-pos);if(video.short)score+=1;return score}
function homeVideos(){let list=[...videos];if(currentCategory!=="Todos")list=list.filter(v=>v.category===currentCategory);if(searchTerm){const q=searchTerm.toLocaleLowerCase("pt-BR");list=list.filter(v=>(v.title+" "+v.channel).toLocaleLowerCase("pt-BR").includes(q))}return list.sort((a,b)=>recommendationScore(b)-recommendationScore(a))}
function renderGrid(list,emptyText){const grid=$("videoGrid");grid.replaceChildren();if(!list.length){const box=document.createElement("div");box.className="emptyBox";box.textContent=emptyText;grid.append(box);return}for(const video of list)grid.append(createCard(video))}
function renderHome(){$("homeTitle").textContent=searchTerm?"Resultados":"Para você";$("homeSubtitle").textContent=searchTerm?"Resultados para “"+searchTerm+"”.":"O feed aprende com o que você assiste neste navegador.";$("chips").style.display="flex";renderGrid(homeVideos(),"Nenhum vídeo encontrado.")}
function renderShorts(){$("homeTitle").textContent="Shorts";$("homeSubtitle").textContent="Vídeos curtos encontrados no feed.";$("chips").style.display="none";renderGrid(videos.filter(v=>v.short),"Nenhum Short disponível.")}
function renderHistory(){$("homeTitle").textContent="Histórico";$("homeSubtitle").textContent="Vídeos assistidos neste navegador.";$("chips").style.display="none";renderGrid(uniqueExisting(readArray("history")),"Seu histórico ainda está vazio.")}
function renderSaved(){$("homeTitle").textContent="Salvos";$("homeSubtitle").textContent="Vídeos marcados para assistir depois.";$("chips").style.display="none";renderGrid(uniqueExisting(readArray("saved")),"Você ainda não salvou nenhum vídeo.")}
function renderCurrentView(){if(currentView==="shorts")renderShorts();else if(currentView==="history")renderHistory();else if(currentView==="saved")renderSaved();else renderHome()}

function setNavActive(view){document.querySelectorAll("[data-view]").forEach(btn=>btn.classList.toggle("active",btn.dataset.view===view))}
function showView(view){currentView=view;currentVideo=null;$("player").src="";$("view-watch").classList.remove("active");$("view-home").classList.add("active");setNavActive(view);renderCurrentView();window.scrollTo({top:0,behavior:"smooth"})}
function rememberWatch(video){let history=readArray("history").filter(id=>id!==video.id);history.unshift(video.id);saveStorage("history",history.slice(0,100));const counts=readObject("counts");counts[video.id]=Number(counts[video.id]||0)+1;saveStorage("counts",counts)}
function updateActionButtons(){if(!currentVideo)return;const liked=readArray("liked").includes(currentVideo.id);const saved=readArray("saved").includes(currentVideo.id);$("likeButton").classList.toggle("on",liked);$("likeButton").textContent=liked?"♥ Curtido":"♡ Curtir";$("laterButton").classList.toggle("on",saved);$("laterButton").textContent=saved?"✓ Salvo":"＋ Assistir depois"}
function renderRelated(){const box=$("relatedList");box.replaceChildren();if(!currentVideo)return;const list=[...videos].filter(v=>v.id!==currentVideo.id).sort((a,b)=>recommendationScore(b)-recommendationScore(a)).slice(0,8);for(const video of list)box.append(createSideCard(video))}
function openVideo(video){currentVideo=video;rememberWatch(video);$("view-home").classList.remove("active");$("view-watch").classList.add("active");$("watchTitle").textContent=video.title;$("watchChannel").textContent=video.channel;$("watchAvatar").textContent=(video.channel[0]||"Y").toUpperCase();$("playerWrap").classList.toggle("shortMode",video.short);$("player").src="https://www.youtube-nocookie.com/embed/"+video.id+"?autoplay=1&playsinline=1&rel=0";updateActionButtons();renderRelated();window.scrollTo({top:0,behavior:"smooth"})}
function toggleStored(name,id){let arr=readArray(name);if(arr.includes(id))arr=arr.filter(x=>x!==id);else arr.unshift(id);saveStorage(name,arr);return arr.includes(id)}
function runSearch(){searchTerm=$("searchInput").value.trim().slice(0,80);currentCategory="Todos";currentView="home";createCategories();showView("home")}

$("searchButton").addEventListener("click",runSearch);$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>{searchTerm="";$("searchInput").value="";showView(button.dataset.view)}));
$("backButton").addEventListener("click",()=>showView(currentView));
$("likeButton").addEventListener("click",()=>{if(currentVideo){toggleStored("liked",currentVideo.id);updateActionButtons()}});
$("laterButton").addEventListener("click",()=>{if(currentVideo){toggleStored("saved",currentVideo.id);updateActionButtons()}});
$("shareButton").addEventListener("click",async()=>{if(!currentVideo)return;const url="https://www.youtube.com/watch?v="+currentVideo.id;try{if(navigator.share)await navigator.share({title:currentVideo.title,url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);$("shareButton").textContent="✓ Link copiado";setTimeout(()=>$("shareButton").textContent="↗ Compartilhar",1600)}}catch{}});

loadVideos();
</script>
</body>
</html>
