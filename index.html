<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="referrer"
  content="strict-origin-when-cross-origin"
>

<title>YouTube 2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0f13;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;

  display: flex;
  gap: 12px;
  align-items: center;

  padding: 12px;

  background: #0d0f13;

  border-bottom:
    1px solid #252b35;
}

.logo {
  font-size: 21px;
  font-weight: 900;
}

.search {
  flex: 1;

  display: flex;

  max-width: 700px;

  margin: auto;
}

.search input {
  width: 100%;

  padding: 12px 15px;

  border: 1px solid #303641;
  border-radius: 15px 0 0 15px;

  background: #161a21;
  color: white;
}

.search button {
  width: 55px;

  border: 0;
  border-radius: 0 15px 15px 0;

  background: #252b35;
  color: white;
}

nav {
  display: flex;

  gap: 8px;

  padding: 14px;

  overflow-x: auto;
}

nav button {
  border: 0;

  padding: 10px 15px;

  border-radius: 20px;

  background: #202631;
  color: white;

  font-weight: bold;
}

nav button.active {
  background: white;
  color: black;
}

main {
  max-width: 1400px;

  margin: auto;

  padding: 16px;
}

.grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 25px 17px;
}

.card {
  cursor: pointer;
}

.thumb {
  width: 100%;

  aspect-ratio: 16 / 9;

  object-fit: cover;

  border-radius: 15px;

  background: #202631;
}

.title {
  margin-top: 10px;

  font-size: 15px;

  font-weight: bold;

  line-height: 1.4;
}

.channel {
  margin-top: 5px;

  color: #9aa4b2;

  font-size: 13px;
}

#watch {
  display: none;
}

.player {
  width: 100%;

  aspect-ratio: 16 / 9;

  border-radius: 18px;

  overflow: hidden;

  background: black;
}

.player iframe {
  width: 100%;
  height: 100%;

  border: 0;
}

.actions {
  display: flex;

  gap: 8px;

  margin: 14px 0;

  flex-wrap: wrap;
}

.actions button {
  border: 0;

  padding: 10px 14px;

  border-radius: 20px;

  background: #202631;
  color: white;
}

.actions .active {
  background: white;
  color: black;
}

.back {
  margin-bottom: 14px;

  border: 0;

  padding: 10px 14px;

  border-radius: 20px;

  background: #202631;
  color: white;
}

.error {
  padding: 20px;

  border-radius: 15px;

  background: #191e26;

  color: #aaa;
}

@media(max-width: 1000px) {
  .grid {
    grid-template-columns:
      repeat(2,1fr);
  }
}

@media(max-width: 650px) {
  .logo {
    font-size: 0;
  }

  .logo::before {
    content: "▶";

    font-size: 22px;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    ▶ YouTube 2
  </div>

  <div class="search">

    <input
      id="search"
      placeholder="Pesquisar"
    >

    <button
      onclick="searchVideos()"
    >
      🔍
    </button>

  </div>

</header>


<nav>

  <button
    class="active"
    onclick="
      showList(
        'home',
        this
      )
    "
  >
    Para você
  </button>

  <button
    onclick="
      showList(
        'history',
        this
      )
    "
  >
    Histórico
  </button>

  <button
    onclick="
      showList(
        'likes',
        this
      )
    "
  >
    Curtidos
  </button>

  <button
    onclick="
      showList(
        'later',
        this
      )
    "
  >
    Assistir depois
  </button>

</nav>


<main>

<section id="home">

  <h1 id="title">
    Para você
  </h1>

  <div
    id="grid"
    class="grid"
  >
    Carregando...
  </div>

</section>


<section id="watch">

  <button
    class="back"
    onclick="backHome()"
  >
    ← Voltar
  </button>

  <div class="player">

    <iframe
      id="player"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share
      "
      referrerpolicy="
        strict-origin-when-cross-origin
      "
      allowfullscreen
    ></iframe>

  </div>

  <h2 id="videoTitle"></h2>

  <div
    id="channel"
    class="channel"
  ></div>

  <div class="actions">

    <button
      id="like"
      onclick="
        toggleSave(
          'likes'
        )
      "
    >
      ♡ Curtir
    </button>

    <button
      id="later"
      onclick="
        toggleSave(
          'later'
        )
      "
    >
      ＋ Assistir depois
    </button>

    <button
      onclick="shareVideo()"
    >
      ↗ Compartilhar
    </button>

  </div>

</section>

</main>


<script>

let videos = [];
let current = null;


function storage(name) {

  try {

    return JSON.parse(
      localStorage.getItem(
        "yt2_" + name
      )
    ) || [];

  } catch {

    return [];

  }

}


function save(name, value) {

  localStorage.setItem(
    "yt2_" + name,
    JSON.stringify(value)
  );

}


function thumbnail(id) {

  return (
    "https://i.ytimg.com/vi/"
    + id
    + "/hqdefault.jpg"
  );

}


async function loadVideos() {

  try {

    const response =
      await fetch(
        "./video_list.json?"
        + Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "HTTP "
        + response.status
      );

    }


    videos =
      await response.json();


    renderVideos(videos);

  } catch(error) {

    document.getElementById(
      "grid"
    ).innerHTML = `

      <div class="error">

        Não consegui carregar
        video_list.json.

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


function renderVideos(list) {

  const grid =
    document.getElementById(
      "grid"
    );


  if (!list.length) {

    grid.innerHTML =
      "Nenhum vídeo.";

    return;

  }


  grid.innerHTML =
    list.map(video => `

      <div
        class="card"
        onclick="
          playVideo(
            '${video.id}'
          )
        "
      >

        <img
          class="thumb"
          src="${
            thumbnail(
              video.id
            )
          }"
        >

        <div class="title">
          ${video.title}
        </div>

        <div class="channel">
          ${video.channel}
        </div>

      </div>

    `).join("");

}


function playVideo(id) {

  current =
    videos.find(
      video =>
        video.id === id
    );


  if (!current)
    return;


  let history =
    storage(
      "history"
    );


  history =
    history.filter(
      item =>
        item !== id
    );


  history.unshift(id);


  save(
    "history",
    history
  );


  let counts =
    storage(
      "counts"
    );


  if (
    Array.isArray(counts)
  ) {
    counts = {};
  }


  counts[id] =
    (counts[id] || 0) + 1;


  save(
    "counts",
    counts
  );


  document.getElementById(
    "home"
  ).style.display =
    "none";


  document.getElementById(
    "watch"
  ).style.display =
    "block";


  document.getElementById(
    "player"
  ).src =
    "https://www.youtube-nocookie.com/embed/"
    + id
    + "?autoplay=1&playsinline=1&rel=0";


  document.getElementById(
    "videoTitle"
  ).textContent =
    current.title;


  document.getElementById(
    "channel"
  ).textContent =
    current.channel;


  updateButtons();


  window.scrollTo(
    0,
    0
  );

}


function toggleSave(name) {

  if (!current)
    return;


  let list =
    storage(name);


  if (
    list.includes(
      current.id
    )
  ) {

    list =
      list.filter(
        id =>
          id !== current.id
      );

  } else {

    list.unshift(
      current.id
    );

  }


  save(
    name,
    list
  );


  updateButtons();

}


function updateButtons() {

  const liked =
    storage(
      "likes"
    ).includes(
      current.id
    );


  const later =
    storage(
      "later"
    ).includes(
      current.id
    );


  const like =
    document.getElementById(
      "like"
    );


  const laterButton =
    document.getElementById(
      "later"
    );


  like.classList.toggle(
    "active",
    liked
  );


  laterButton.classList.toggle(
    "active",
    later
  );


  like.textContent =
    liked
      ? "♥ Curtido"
      : "♡ Curtir";


  laterButton.textContent =
    later
      ? "✓ Salvo"
      : "＋ Assistir depois";

}


function showList(
  type,
  button
) {

  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      element =>
        element.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  document.getElementById(
    "watch"
  ).style.display =
    "none";


  document.getElementById(
    "home"
  ).style.display =
    "block";


  let list =
    videos;


  let heading =
    "Para você";


  if (
    type !== "home"
  ) {

    const ids =
      storage(type);


    list =
      ids.map(
        id =>
          videos.find(
            video =>
              video.id === id
          )
      )
      .filter(Boolean);


    heading =
      type === "history"
        ? "Histórico"
        : type === "likes"
        ? "Curtidos"
        : "Assistir depois";

  }


  document.getElementById(
    "title"
  ).textContent =
    heading;


  renderVideos(list);

}


function backHome() {

  document.getElementById(
    "player"
  ).src = "";


  document.getElementById(
    "watch"
  ).style.display =
    "none";


  document.getElementById(
    "home"
  ).style.display =
    "block";


  renderVideos(videos);

}


function searchVideos() {

  const query =
    document.getElementById(
      "search"
    )
    .value
    .trim()
    .toLowerCase();


  const result =
    videos.filter(
      video =>
        (
          video.title
          + " "
          + video.channel
        )
        .toLowerCase()
        .includes(query)
    );


  document.getElementById(
    "title"
  ).textContent =
    query
      ? "Resultados"
      : "Para você";


  renderVideos(
    query
      ? result
      : videos
  );

}


async function shareVideo() {

  if (!current)
    return;


  const url =
    "https://youtu.be/"
    + current.id;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        title:
          current.title,

        url
      });

    } catch {}

  } else {

    await navigator
      .clipboard
      .writeText(url);

  }

}


document
  .getElementById(
    "search"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        searchVideos();

      }

    }
  );


loadVideos();

</script>

</body>
</html>
