<!doctype html>

<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    viewport-fit=cover
  "
>

<meta
  name="referrer"
  content="strict-origin-when-cross-origin"
>

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    base-uri 'none';
    object-src 'none';
    form-action 'none';
    img-src
      'self'
      https://i.ytimg.com
      https://img.youtube.com
      data:;
    frame-src
      https://www.youtube-nocookie.com
      https://www.youtube.com;
    connect-src 'self';
    style-src
      'self'
      'unsafe-inline';
    script-src
      'self'
      'unsafe-inline';
    upgrade-insecure-requests;
  "
>

<meta
  name="theme-color"
  content="#0b0d12"
>

<title>YouTube 2</title>


<style>

:root {

  color-scheme: dark;

  --bg: #0b0d12;

  --surface: #131721;

  --surface2: #1b2130;

  --line: #262e3e;

  --text: #f7f8fb;

  --muted: #9ba6b7;

  --accent: #ff3d6e;

  --accent2: #7c5cff;

  --header: 68px;

  --rail: 232px;

  --radius: 18px;

}


* {

  box-sizing: border-box;

}


html {

  scroll-behavior: smooth;

}


body {

  margin: 0;

  min-height: 100vh;

  background: var(--bg);

  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

}


button,
input {

  font: inherit;

}


button {

  cursor: pointer;

}


/* ==============================
   HEADER
============================== */

.topbar {

  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: var(--header);

  z-index: 50;

  display: flex;

  align-items: center;

  gap: 14px;

  padding: 10px 18px;

  background:
    rgba(
      11,
      13,
      18,
      .92
    );

  border-bottom:
    1px solid
    var(--line);

  backdrop-filter:
    blur(16px);

}


.brand {

  display: flex;

  align-items: center;

  gap: 10px;

  min-width: 200px;

  font-weight: 900;

  font-size: 20px;

}


.brandMark {

  width: 36px;

  height: 36px;

  border-radius: 12px;

  display: grid;

  place-items: center;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

}


.searchBox {

  flex: 1;

  max-width: 760px;

  margin: auto;

  display: flex;

}


.searchBox input {

  width: 100%;

  height: 44px;

  padding: 0 15px;

  border:
    1px solid
    var(--line);

  border-right: 0;

  border-radius:
    14px 0 0 14px;

  outline: 0;

  background: #0f131c;

  color: var(--text);

}


.searchBox input:focus {

  border-color: #59657a;

}


.searchBox button {

  width: 54px;

  border:
    1px solid
    var(--line);

  border-radius:
    0 14px 14px 0;

  background:
    var(--surface2);

  color:
    var(--text);

}


.profile {

  width: 40px;

  height: 40px;

  border: 0;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #4f8cff,
      #8d5cff
    );

  color: white;

  font-weight: 900;

}


/* ==============================
   MENU PC
============================== */

.rail {

  position: fixed;

  left: 0;

  top: var(--header);

  bottom: 0;

  width: var(--rail);

  z-index: 40;

  padding: 16px 12px;

  border-right:
    1px solid
    var(--line);

  background: var(--bg);

}


.navBtn {

  width: 100%;

  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 6px;

  padding: 12px 13px;

  border: 0;

  border-radius: 13px;

  text-align: left;

  background: transparent;

  color: var(--muted);

  font-weight: 750;

}


.navBtn:hover,
.navBtn.active {

  background:
    var(--surface2);

  color:
    var(--text);

}


.navIcon {

  width: 24px;

  text-align: center;

  font-size: 19px;

}


/* ==============================
   MAIN
============================== */

.main {

  max-width: 1680px;

  margin-left:
    var(--rail);

  padding:
    calc(
      var(--header) + 20px
    )
    24px
    90px;

}


.view {

  display: none;

}


.view.active {

  display: block;

}


/* ==============================
   HERO
============================== */

.hero {

  display: flex;

  justify-content:
    space-between;

  align-items: end;

  gap: 15px;

  margin:
    4px 0 20px;

}


.hero h1 {

  margin: 0;

  font-size:
    clamp(
      26px,
      4vw,
      38px
    );

}


.hero p {

  margin:
    7px 0 0;

  color:
    var(--muted);

}


.badge {

  padding:
    8px 11px;

  border:
    1px solid
    var(--line);

  border-radius:
    999px;

  background:
    var(--surface);

  color:
    var(--muted);

  font-size:
    12px;

}


/* ==============================
   CATEGORIAS
============================== */

.chips {

  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 18px;

  scrollbar-width: none;

}


.chips::-webkit-scrollbar {

  display: none;

}


.chip {

  padding:
    9px 13px;

  border:
    1px solid
    var(--line);

  border-radius:
    999px;

  background:
    var(--surface);

  color:
    var(--text);

  white-space:
    nowrap;

  font-weight:
    700;

}


.chip.active {

  background:
    var(--text);

  color:
    #0c0f14;

}


/* ==============================
   GRID
============================== */

.grid {

  display: grid;

  grid-template-columns:
    repeat(
      4,
      minmax(
        0,
        1fr
      )
    );

  gap:
    26px 17px;

}


.card {

  min-width: 0;

  cursor: pointer;

  outline: none;

}


.thumb {

  position: relative;

  aspect-ratio:
    16 / 9;

  overflow: hidden;

  border-radius:
    var(--radius);

  background:
    var(--surface2);

}


.thumb img {

  display: block;

  width: 100%;

  height: 100%;

  object-fit: cover;

  transition:
    transform .22s;

}


.card:hover
.thumb img {

  transform:
    scale(1.025);

}


.shortPill {

  position: absolute;

  right: 9px;

  bottom: 9px;

  padding:
    5px 8px;

  border-radius:
    999px;

  background:
    rgba(
      0,
      0,
      0,
      .78
    );

  font-size:
    11px;

  font-weight:
    850;

}


.cardBody {

  display: flex;

  gap: 10px;

  padding-top:
    11px;

}


.channelDot {

  width: 38px;

  height: 38px;

  flex:
    0 0 38px;

  display: grid;

  place-items:
    center;

  border-radius:
    12px;

  background:
    linear-gradient(
      135deg,
      #2e7cff,
      #24d3b5
    );

  font-weight:
    900;

}


.cardTitle {

  font-weight:
    800;

  line-height:
    1.35;

  display:
    -webkit-box;

  -webkit-line-clamp:
    2;

  -webkit-box-orient:
    vertical;

  overflow:
    hidden;

}


.cardMeta {

  margin-top:
    5px;

  color:
    var(--muted);

  font-size:
    13px;

  white-space:
    nowrap;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

}


/* ==============================
   PLAYER
============================== */

.watchLayout {

  display: grid;

  grid-template-columns:
    minmax(
      0,
      1fr
    )
    360px;

  gap: 24px;

}


.playerWrap {

  width: 100%;

  aspect-ratio:
    16 / 9;

  overflow:
    hidden;

  border-radius:
    22px;

  background:
    black;

}


.playerWrap.shortMode {

  max-width:
    430px;

  margin: auto;

  aspect-ratio:
    9 / 16;

}


.playerWrap iframe {

  display: block;

  width: 100%;

  height: 100%;

  border: 0;

}


.watchTitle {

  margin:
    16px 0 10px;

  font-size:
    clamp(
      20px,
      3vw,
      27px
    );

}


.channelRow {

  display: flex;

  align-items: center;

  gap: 10px;

  color:
    var(--muted);

}


.actions {

  display: flex;

  flex-wrap:
    wrap;

  gap: 8px;

  margin:
    15px 0;

}


.action {

  padding:
    10px 14px;

  border:
    1px solid
    var(--line);

  border-radius:
    999px;

  background:
    var(--surface2);

  color:
    var(--text);

  font-weight:
    750;

}


.action.on {

  background:
    var(--text);

  color:
    #10131a;

}


.description {

  padding: 15px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    var(--surface);

  color:
    var(--muted);

  line-height:
    1.55;

}


/* ==============================
   RECOMENDADOS
============================== */

.sideCard {

  display: grid;

  grid-template-columns:
    150px 1fr;

  gap: 10px;

  margin-bottom:
    12px;

  cursor:
    pointer;

}


.sideCard img {

  width: 150px;

  aspect-ratio:
    16 / 9;

  object-fit:
    cover;

  border-radius:
    11px;

}


.sideCardTitle {

  font-size:
    13px;

  font-weight:
    800;

  line-height:
    1.35;

}


/* ==============================
   ERROS
============================== */

.errorBox {

  grid-column:
    1 / -1;

  padding:
    36px 20px;

  border:
    1px solid
    var(--line);

  border-radius:
    var(--radius);

  background:
    var(--surface);

  color:
    var(--muted);

  text-align:
    center;

}


/* ==============================
   MENU MOBILE
============================== */

.bottomNav {

  display: none;

}


/* ==============================
   TABLET
============================== */

@media(
  max-width: 1250px
) {

  .grid {

    grid-template-columns:
      repeat(
        3,
        1fr
      );

  }

}


/* ==============================
   MOBILE/TABLET
============================== */

@media(
  max-width: 980px
) {

  :root {

    --rail: 0px;

  }


  .rail {

    display:
      none;

  }


  .main {

    margin-left:
      0;

    padding-left:
      16px;

    padding-right:
      16px;

  }


  .grid {

    grid-template-columns:
      repeat(
        2,
        1fr
      );

  }


  .watchLayout {

    grid-template-columns:
      1fr;

  }


  .bottomNav {

    position:
      fixed;

    z-index:
      60;

    left:
      10px;

    right:
      10px;

    bottom:
      max(
        10px,
        env(
          safe-area-inset-bottom
        )
      );

    height:
      62px;

    display:
      grid;

    grid-template-columns:
      repeat(
        4,
        1fr
      );

    padding:
      5px;

    border:
      1px solid
      var(--line);

    border-radius:
      20px;

    background:
      rgba(
        19,
        23,
        33,
        .96
      );

    backdrop-filter:
      blur(18px);

  }


  .bottomNav button {

    border: 0;

    border-radius:
      15px;

    background:
      transparent;

    color:
      var(--muted);

    font-size:
      11px;

    font-weight:
      800;

  }


  .bottomNav
  button.active {

    background:
      var(--surface2);

    color:
      var(--text);

  }

}


/* ==============================
   CELULAR
============================== */

@media(
  max-width: 620px
) {

  .topbar {

    padding:
      9px 10px;

    gap: 8px;

  }


  .brand {

    min-width:
      auto;

  }


  .brandText {

    display:
      none;

  }


  .profile {

    display:
      none;

  }


  .main {

    padding-left:
      10px;

    padding-right:
      10px;

  }


  .grid {

    grid-template-columns:
      1fr;

    gap:
      24px;

  }


  .hero {

    flex-direction:
      column;

    align-items:
      flex-start;

  }


  .badge {

    display:
      none;

  }


  .sideCard {

    grid-template-columns:
      140px 1fr;

  }


  .sideCard img {

    width:
      140px;

  }

}

</style>

</head>


<body>

  <div class="searchBox">

<script>

"use strict";


const CONFIG = {

  DATA_URL:
    "./video_list.json",

  MAX_VIDEOS:
    40,

  PREFIX:
    "yt2_v3_",

  ID_PATTERN:
    /^[A-Za-z0-9_-]{11}$/

};


let videos = [];

let currentVideo = null;

let currentView = "home";

let currentCategory = "Todos";


const $ = id =>
  document.getElementById(id);


/* ==============================
   STORAGE
============================== */

function storageKey(name) {

  return (
    CONFIG.PREFIX
    + name
  );

}


function readArray(name) {

  try {

    const value =
      JSON.parse(
        localStorage.getItem(
          storageKey(name)
        ) || "[]"
      );


    if (!Array.isArray(value)) {

      return [];

    }


    return value
      .filter(
        item =>
          typeof item === "string"
          &&
          CONFIG.ID_PATTERN.test(
            item
          )
      )
      .slice(
        0,
        100
      );


  } catch {

    return [];

  }

}


function readObject(name) {

  try {

    const value =
      JSON.parse(
        localStorage.getItem(
          storageKey(name)
        ) || "{}"
      );


    if (
      !value
      ||
      typeof value !== "object"
      ||
      Array.isArray(value)
    ) {

      return {};

    }


    return value;


  } catch {

    return {};

  }

}


function saveStorage(
  name,
  value
) {

  try {

    localStorage.setItem(

      storageKey(name),

      JSON.stringify(value)

    );

  } catch {}

}


/* ==============================
   VALIDAR VÍDEO
============================== */

function safeVideo(raw) {

  if (
    !raw
    ||
    typeof raw !== "object"
  ) {

    return null;

  }


  const id =
    String(
      raw.id || ""
    ).trim();


  if (
    !CONFIG.ID_PATTERN.test(id)
  ) {

    return null;

  }


  const title =
    String(
      raw.title || "Vídeo"
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim()
    .slice(
      0,
      180
    );


  const channel =
    String(
      raw.channel || "YouTube"
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim()
    .slice(
      0,
      100
    );


  return {

    id,

    title:
      title || "Vídeo",

    channel:
      channel || "YouTube",

    category:
      raw.short === true
        ? "Shorts"
        : "Vídeos",

    short:
      raw.short === true

  };

}


/* ==============================
   THUMB
============================== */

function thumbnail(id) {

  return (
    "https://i.ytimg.com/vi/"
    + id
    + "/hqdefault.jpg"
  );

}


/* ==============================
   CARREGAR JSON
============================== */

async function loadVideos() {

  try {

    const response =
      await fetch(

        CONFIG.DATA_URL
        + "?v="
        + Date.now(),

        {
          cache:
            "no-store"
        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP "
        + response.status
      );

    }


    const document =
      await response.json();


    const rawVideos =
      Array.isArray(document)
        ? document
        : document.videos;


    if (
      !Array.isArray(
        rawVideos
      )
    ) {

      throw new Error(
        "Formato JSON inválido."
      );

    }


    const unique =
      new Map();


    for (
      const raw
      of rawVideos
    ) {

      const video =
        safeVideo(raw);


      if (
        video
        &&
        !unique.has(
          video.id
        )
      ) {

        unique.set(
          video.id,
          video
        );

      }


      if (
        unique.size >=
        CONFIG.MAX_VIDEOS
      ) {

        break;

      }

    }


    videos =
      [
        ...unique.values()
      ];


    if (!videos.length) {

      throw new Error(
        "Nenhum vídeo válido."
      );

    }


    $("feedBadge").textContent =
      videos.length
      + " vídeos";


    createCategories();

    renderCurrentView();


  } catch(error) {

    console.error(error);


    $("feedBadge")
      .textContent =
        "Feed indisponível";


    const box =
      document.createElement(
        "div"
      );


    box.className =
      "errorBox";


    box.textContent =
      "Não foi possível carregar "
      + "video_list.json.";


    $("videoGrid")
      .replaceChildren(box);

  }

}


/* ==============================
   CRIAR CARD
============================== */

function createCard(video) {

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "card";


  card.tabIndex = 0;


  const thumb =
    document.createElement(
      "div"
    );


  thumb.className =
    "thumb";


  const image =
    document.createElement(
      "img"
    );


  image.loading =
    "lazy";


  image.alt = "";


  image.src =
    thumbnail(
      video.id
    );


  thumb.append(
    image
  );


  if (
    video.short
  ) {

    const badge =
      document.createElement(
        "span"
      );


    badge.className =
